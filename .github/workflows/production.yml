name: Production

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never interrupt a remote update midway; EC2 also serializes deployments with flock.
concurrency:
  group: oddbid-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  backend:
    name: Deploy EC2 backend
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      AWS_PAGER: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Check deployment configuration before changing the server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node deploy/validate-production-env.mjs
      - name: Get temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: oddbid-${{ github.run_id }}
      - name: Build and push an immutable backend image
        shell: bash
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_uri="${registry}/${ECR_REPOSITORY}:${release_id}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=${GITHUB_SHA}" -f deploy/Dockerfile -t "$image_uri" .
          docker push "$image_uri"
          printf 'IMAGE_URI=%s\nRELEASE_ID=%s\n' "$image_uri" "$release_id" >> "$GITHUB_ENV"
      - name: Update EC2 through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          node deploy/make-ssm-command.mjs > "$RUNNER_TEMP/oddbid-ssm.json"
          command_id="$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" --document-name AWS-RunShellScript --parameters "file://$RUNNER_TEMP/oddbid-ssm.json" --timeout-seconds 120 --comment "OddBid ${GITHUB_SHA}" --query Command.CommandId --output text)"
          node deploy/wait-ssm.mjs "$command_id" "$EC2_INSTANCE_ID"
      - name: Verify public HTTPS health and deployed revision
        run: node deploy/check-health.mjs "$BACKEND_URL" "$GITHUB_SHA" "$FRONTEND_ORIGIN"

  frontend:
    name: Deploy Vercel frontend
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@62.2.0
      - name: Pull production project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build frontend for the verified backend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Recheck backend before publishing frontend
        run: node deploy/check-health.mjs "$BACKEND_URL" "$GITHUB_SHA" "$FRONTEND_ORIGIN"
      - name: Publish frontend
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          printf 'Frontend: %s\nBackend revision: %s\n' "$deployment_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
